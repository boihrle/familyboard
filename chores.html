<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Chores — FamilyBoards</title>
  <meta name="description" content="Weekly Chores: magnetic day words, full names, 3–7 rows. Hero photo updates as you click.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.55">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product product-chores">
    <div>
      <div id="hero-stage" class="board-stage photo-stage mount-magnetic size-a4" role="region" aria-label="Chores.">
        <figure id="board-hero" class="hero-photo-frame board-a4 mount-magnetic" data-lines="3">
          <img src="images/chores-hero-photo.png" width="1280" height="720" alt="White ferrous weekly chores board on light wood, same width as the Routines picture. Magnetic day words Sun through Sat; empty name column; title-case chore tiles from the old set plus Clean Room, Clear Table, Put Away Washing, and Washing.">
        </figure>
      </div>
      <p id="hero-caption">3 name rows · A4</p>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Board</p>
      <h1>Chores</h1>
      <p class="muted">One row per person on a weekly grid. Day labels are magnetic tiles (Sun–Sat), not printed. Full first-name tiles sit on the left; chore tiles go in the cells. Empty cells are fine.</p>

      <fieldset>
        <legend>Line count</legend>
        <div id="opt-lines" class="opts" role="group" aria-label="Line count"></div>
      </fieldset>
      <fieldset>
        <legend>Size</legend>
        <div id="opt-size" class="opts" role="group" aria-label="Size"></div>
      </fieldset>

      <div class="price-row">
        <span id="config-now" class="muted">3 name rows · A4</span>
        <strong id="price-now">$29</strong>
      </div>
      <button class="btn" id="add-board" type="button">Add to cart</button>
      <p class="fine muted">Cart can hold this board plus any pack.</p>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js?v=2.55"></script>
  <script src="js/chores.js?v=2.55"></script>
</body>
</html>
