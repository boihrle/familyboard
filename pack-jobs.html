<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Jobs pack — FamilyBoard</title>
  <meta name="description" content="Magnetic job tiles for morning, afternoon, and night routines.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600&family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product product-photo">
    <div>
      <div class="board-stage photo-stage" role="region" aria-label="Jobs pack on light wood.">
        <figure class="hero-photo-frame">
          <img src="images/jobs-pack-hero.png" width="1280" height="720" alt="Twenty-four white magnetic job tiles on light wood, including tidy room, homework, walk dog, and wash dishes. No fridge.">
        </figure>
      </div>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Word pack</p>
      <h1>Jobs pack</h1>
      <p class="muted">Routine jobs for Morning, Afternoon, and Night boards — tidy room, unpack bag, lights out, and more. Same magnet size as names.</p>
      <div class="price-row">
        <span class="muted">24 tiles · magnetic</span>
        <strong>$22</strong>
      </div>
      <button class="btn" id="add-pack" type="button" data-sku="pack-jobs">Add to cart</button>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/photo-pack.js"></script>
</body>
</html>
