<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Day Word Pack — FamilyBoard</title>
  <meta name="description" content="Magnetic Day Word Pack. Sun through Sat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600&family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product product-photo">
    <div>
      <div class="board-stage photo-stage" role="region" aria-label="Day Word Pack on light wood.">
        <figure class="hero-photo-frame">
          <img src="images/day-tiles-pack-hero.png" width="1280" height="720" alt="Seven white magnetic day words on light wood: Sun, Mon, Tue, Wed, Thu, Fri, Sat.">
        </figure>
      </div>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Word pack</p>
      <h1>Day Word Pack</h1>
      <p class="muted"><strong>Sun Mon Tue Wed Thu Fri Sat</strong> — capital first letter. Use with Weekly, Chores, or any grid that needs days as words rather than printed labels.</p>
      <div class="price-row">
        <span class="muted">7 tiles · magnetic</span>
        <strong>$12</strong>
      </div>
      <button class="btn" id="add-pack" type="button" data-sku="pack-days">Add to cart</button>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/photo-pack.js"></script>
</body>
</html>
