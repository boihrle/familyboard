<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Sticker Pack — FamilyBoards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.63">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product product-photo">
    <div>
      <div class="board-stage photo-stage" role="region" aria-label="Sticker Pack on light wood.">
        <figure class="hero-photo-frame">
          <img src="images/sticker-pack-hero.jpg" width="1280" height="720" alt="A random mix of cute animal cartoon graffiti stickers on light wood.">
        </figure>
      </div>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Pack</p>
      <h1>Sticker Pack</h1>
      <p class="muted">Random stickers to customise the board. Not word stickers and not chore-word tiles.</p>
      <div class="price-row">
        <span class="muted">Stickers</span>
        <strong>$8</strong>
      </div>
      <button class="btn" id="add-pack" type="button" data-sku="pack-sticker">Add to cart</button>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js?v=2.63"></script>
  <script src="js/photo-pack.js"></script>
</body>
</html>
