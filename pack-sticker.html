<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Sticker pack — FamilyBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product">
    <div class="hero-stage mount-stick">
      <div class="board mount-stick">
        <div class="board-head">Sticker sheet</div>
        <div class="magnet-tray" id="sticker-tray"></div>
        <div class="board-foot">Non-magnetic · peel and place</div>
      </div>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Pack</p>
      <h1>Sticker pack</h1>
      <p class="muted">Flat, non-magnetic stickers — same words as the chores pack, without the magnet back. Use on nonstick boards or paper charts.</p>
      <div class="price-row">
        <span class="muted">16 stickers · non-magnetic</span>
        <strong>$12</strong>
      </div>
      <button class="btn" id="add-pack" type="button">Add to cart</button>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("sticker-tray").innerHTML = FamilyBoard.CHORES_WORDS.map(function (word) {
        return '<span class="magnet magnet-word flat">' + word + "</span>";
      }).join("");
      document.getElementById("add-pack").addEventListener("click", function () {
        FamilyBoard.addItem({
          productId: "pack-sticker",
          name: "Sticker pack",
          kind: "pack",
          price: FamilyBoard.PRODUCTS["pack-sticker"].price
        });
        FBSite.toast("Sticker pack added to cart");
      });
    });
  </script>
</body>
</html>
