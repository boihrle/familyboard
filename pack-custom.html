<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Custom Words — FamilyBoards</title>
  <link rel="canonical" href="https://boihrle.github.io/familyboard/pack-custom.html">
  <meta property="og:title" content="Custom Words — FamilyBoards">
  <meta property="og:description" content="FamilyBoards thin magnetic sheets, boards, and magnet packs — for the fridge or a wall.">
  <meta property="og:image" content="https://boihrle.github.io/familyboard/images/chores-hero-photo.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:url" content="https://boihrle.github.io/familyboard/pack-custom.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FamilyBoards">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Custom Words — FamilyBoards">
  <meta name="twitter:description" content="FamilyBoards thin magnetic sheets, boards, and magnet packs — for the fridge or a wall.">
  <meta name="twitter:image" content="https://boihrle.github.io/familyboard/images/chores-hero-photo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.73">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product product-photo">
    <div>
      <div class="board-stage photo-stage" role="region" aria-label="Custom Words on light wood.">
        <figure class="hero-photo-frame">
          <img src="images/custom-words-hero.png" width="1280" height="720" alt="Three white magnetic tiles on light wood, one word each: Your, Name, Here.">
        </figure>
      </div>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Word pack</p>
      <h1>Custom Words</h1>
      <p class="muted">Choose any 16 words, such as names, and we'll make them as word tiles.</p>
      <form id="word-form" class="word-form">
        <input id="word-input" type="text" maxlength="14" placeholder="Add a name or word" autocomplete="off">
        <button class="btn ghost" id="word-add" type="submit">Add word</button>
      </form>
      <ul id="word-list" class="chip-list"></ul>
      <p id="word-meta" class="muted">0 of 16 tiles</p>
      <div class="price-row">
        <span class="muted">Up to 16 tiles · magnetic</span>
        <strong>$15</strong>
      </div>
      <button class="btn" id="add-custom" type="button">Add to cart</button>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js?v=2.73"></script>
  <script src="js/site.js?v=2.73"></script>
  <script src="js/custom-pack.js?v=2.73"></script>
</body>
</html>
