<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cart — FamilyBoards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div id="site-header"></div>
  <main class="wrap">
    <p class="kicker" style="margin-top:36px">Cart</p>
    <h1>Board + packs</h1>
    <p class="muted">One cart for any mix of boards and packs.</p>
    <p id="cart-empty" class="note" hidden>Cart is empty. Start with <a href="chores.html">Chores</a>.</p>
    <div id="cart-list"></div>
    <div id="cart-summary" hidden>
      <p>Total <strong id="cart-total">$0</strong></p>
      <button class="btn" id="pay-btn" type="button">Pay</button>
    </div>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js?v=2.58"></script>
