<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Morning — FamilyBoards</title>
  <meta name="description" content="Thin magnetic routine board. Choose Morning, Afternoon, or Night. Title at the top; people as columns.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.64">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product product-photo" data-sku="routines-board">
    <div>
      <div id="hero-stage" class="board-stage photo-stage mount-magnetic size-a4" role="region" aria-label="Routine board on light wood.">
        <figure id="board-hero" class="hero-photo-frame board-a4 mount-magnetic" data-daypart="morning">
          <img src="images/morning-hero.png" width="1280" height="720" alt="Thin white magnetic Morning board on light wood. Title Morning at the top; empty name tiles and job tiles in title case.">
        </figure>
      </div>
      <p id="hero-caption">Morning · A4</p>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Board</p>
      <h1>Morning</h1>
      <p class="muted">Title Morning at the top. One column per person — stack the job tiles underneath.</p>
      <fieldset>
        <legend>Board</legend>
        <div id="opt-daypart" class="opts" role="group" aria-label="Morning, Afternoon, or Night"></div>
      </fieldset>
      <fieldset>
        <legend>Size</legend>
        <div id="opt-size" class="opts" role="group" aria-label="Size"></div>
      </fieldset>

      <div class="price-row">
        <span id="config-now" class="muted">Morning · A4</span>
        <strong id="price-now">$29</strong>
      </div>
      <button class="btn" id="add-board" type="button">Add to cart</button>
      <p class="fine muted">Cart can hold this board plus any pack.</p>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js?v=2.64"></script>
  <script src="js/photo-board.js"></script>
</body>
</html>
