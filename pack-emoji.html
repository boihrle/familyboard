<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Emoji Pack — FamilyBoards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.39">
</head>
<body>
  <div id="site-header"></div>
  <main class="wrap product">
    <div class="hero-stage mount-magnetic">
      <div class="board">
        <div class="board-head">Emoji magnets</div>
        <div class="magnet-tray" id="emoji-tray"></div>
        <div class="board-foot">Magnetic · same tile size</div>
      </div>
    </div>
    <aside class="buy-panel">
      <p class="kicker">Pack</p>
      <h1>Emoji Pack</h1>
      <p class="muted">Magnetic emoji tiles for stars, pets, wins, and moods. They snap onto the board like names and chores.</p>
      <div class="price-row">
        <span class="muted">12 tiles · magnetic</span>
        <strong>$15</strong>
      </div>
      <button class="btn" id="add-pack" type="button">Add to cart</button>
    </aside>
  </main>
  <footer id="site-footer" class="wrap"></footer>
  <script src="js/store.js"></script>
  <script src="js/site.js?v=2.39"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("emoji-tray").innerHTML = FamilyBoard.EMOJIS.map(function (emoji) {
        return '<span class="magnet magnet-word">' + emoji + "</span>";
      }).join("");
      document.getElementById("add-pack").addEventListener("click", function () {
        FamilyBoard.addItem({
          productId: "pack-emoji",
          name: FamilyBoard.PRODUCTS["pack-emoji"].name,
          kind: "pack",
          price: FamilyBoard.PRODUCTS["pack-emoji"].price
        });
        FBSite.toast(FamilyBoard.PRODUCTS["pack-emoji"].name + " added to cart");
      });
    });
  </script>
</body>
</html>
